plugins { id 'com.android.application' version '8.6.1' }
android {
    namespace 'studio.dancecube.android'
    compileSdk 35
    defaultConfig {
        applicationId 'studio.dancecube.android'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.0.1-preview'
    }
    sourceSets { main { manifest.srcFile 'AndroidManifest.xml'; java.srcDirs = ['src']; assets.srcDirs = ['assets']; res.srcDirs = ['res'] } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    if (System.getenv('DC_KEYSTORE')) {
        signingConfigs { preview {
            storeFile file(System.getenv('DC_KEYSTORE'))
            storePassword file(System.getenv('DC_KEY_PASSWORD_FILE')).text.trim()
            keyAlias 'dancecube'
            keyPassword storePassword
        } }
        buildTypes { release { signingConfig signingConfigs.preview } }
    }
}
